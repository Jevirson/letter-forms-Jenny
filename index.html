<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Farewell Ms. Jenny — Letter Portal</title>
  <link rel="stylesheet" href="app.css">
</head>
<body>
  <main class="page page--center">
    <section class="card card--compact role-portal">
      <div class="portal-emblem">💌</div>
      <h1>Farewell, Ms. Jenny</h1>
      <p class="subtitle">
        A little corner to hold the warmest words<br>
        from the people who'll miss you most.
      </p>
      <div class="floral-deco">✦ ✿ ✦</div>
      <div class="role-grid">
        <a class="role-card" href="login.html?role=student">
          <span class="role-icon">✏️</span>
          <span class="role-label">Student</span>
          <span class="role-desc">Write & save your farewell letter</span>
        </a>
        <a class="role-card" href="login.html?role=teacher">
          <span class="role-icon">👩‍🏫</span>
          <span class="role-label">Teacher</span>
          <span class="role-desc">Read the letters from your students</span>
        </a>
      </div>
      <p class="hint" style="text-align:center;">Choose your role to continue ↑</p>
    </section>
  </main>

  <script src="shared.js"></script>
</body>
</html>
